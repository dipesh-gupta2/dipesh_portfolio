# Free Supabase projects go to sleep after a week without use.
# This asks the database for one tiny row every three days so it stays awake.
# It reads the address and the public key from config.js, so there is nothing to set up here.
name: Keep the database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the database for the live content
        run: |
          URL=$(sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*supabaseKey: *'\([^']*\)'.*/\1/p" config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js has no database yet, nothing to do"; exit 0; fi
          curl -fsS -o /dev/null -w "Database answered %{http_code}\n" "${URL%/}/rest/v1/site_content?select=id&limit=1" -H "apikey: $KEY"
